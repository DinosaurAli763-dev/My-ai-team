 
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Team</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: white;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px 18px;
}

h1 {
    text-align: center;
    font-size: 38px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 30px;
}

textarea {
    width: 100%;
    min-height: 150px;
    padding: 18px;
    border-radius: 14px;
    border: 1px solid #334155;
    background: #1e293b;
    color: white;
    font-size: 17px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: #6366f1;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4f46e5;
}

.team {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-top: 30px;
}

.agent {
    padding: 20px;
    border-radius: 15px;
    background: #1e293b;
    border: 1px solid #334155;
    text-align: center;
}

.agent-icon {
    font-size: 35px;
}

.agent-name {
    font-weight: bold;
    margin-top: 8px;
}

.agent-status {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 5px;
}

#result {
    display: none;
    margin-top: 30px;
    padding: 20px;
    background: #1e293b;
    border-radius: 15px;
    white-space: pre-wrap;
}
</style>

</head>

<body>

<div class="container">

<h1>🤖 My AI Team</h1>

<div class="subtitle">
One question. Multiple AI specialists.
</div>

<textarea id="question"
placeholder="Tell your AI team what you want to accomplish..."></textarea>

<button onclick="runTeam()">🚀 RUN AI TEAM</button>

<div class="team">

<div class="agent">
<div class="agent-icon">🧠</div>
<div class="agent-name">Boss AI</div>
<div class="agent-status">Plans the task</div>
</div>

<div class="agent">
<div class="agent-icon">🔎</div>
<div class="agent-name">Research AI</div>
<div class="agent-status">Finds information</div>
</div>

<div class="agent">
<div class="agent-icon">💻</div>
<div class="agent-name">Coding AI</div>
<div class="agent-status">Writes code</div>
</div>

<div class="agent">
<div class="agent-icon">👁️</div>
<div class="agent-name">Vision AI</div>
<div class="agent-status">Analyzes images</div>
</div>

<div class="agent">
<div class="agent-icon">🛡️</div>
<div class="agent-name">Critic AI</div>
<div class="agent-status">Checks the work</div>
</div>

</div>

<div id="result"></div>

</div>

<script>

function runTeam() {

    const question =
        document.getElementById("question").value.trim();

    const result =
        document.getElementById("result");

    if (!question) {
        alert("Enter a task first.");
        return;
    }

    result.style.display = "block";

    result.textContent =
`🤖 AI TEAM PLAN

Your task:
${question}

🧠 BOSS AI
Break the task into smaller jobs.

🔎 RESEARCH AI
Find the important facts and information.

💻 CODING AI
Handle programming or technical work if needed.

👁️ VISION AI
Analyze images if the task contains images.

🛡️ CRITIC AI
Check the other results for mistakes.

🔄 FINAL BOSS
Combine the useful results into one answer.

This is Version 1 of your AI Team.`;

}

</script>

</body>
</html>
